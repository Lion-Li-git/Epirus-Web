name: gates

# 为什么加这个文件
# ────────────────
# 本仓的"当前状态" = np + spec + smoke + battle + 演化页页内自检 **五道在同一棵树上全绿**（见 tools/gate-all.mjs 头注；
#   §E365 之前只有四道 —— 第五道是这次补的，因为 champion-map 的自检此前**不在任何门禁的读取面上**）。
# 但在这之前，这几道**只在本机有效**：线上仓库没有任何自动验证，第三方复核要自己开终端跑约 10 分钟，
# 而且每个数字都得自己重算。门禁那几百道（**条数与末号由 `np-test` 跑完自己印，这里不抄** —— 抄过一次"259 道"就漂成了历史数字）
# 是一笔很贵的资产，让它跟着仓库走比跟着某台机器走值钱。
#
# §E355（10-06 用户裁定）：这个 workflow 现在负责的是**"整轮兜底"那一遍**
# ────────────────────────────────────────────────────────────────────
# 本机口径已经改成"按班次只跑对应模块那一组"（§E335 六组 + §E341 `gate-all --auto` 自己判该跑哪组；
#   改图/改文档 ⇒ `--group=meta` 15 道 ≈ 9.7 秒，而不是每次 10~15 分钟）。
# ⇒ 分组提速的代价是**红会跨组潜伏**，而且真发生过：D225⑩c 从 `c9c382b`（README 排版整理）起一直红，
#   之后五笔提交、约 11 小时没人看见 —— 因为那几遍跑的都是 `--group=meta`，而那道门在 `train` 组里。
# ⇒ 所以本文件现在的职责 = **每笔 push / 每个 PR 跑一遍不带 `--group` 的 np 整轮**（阻断档 `gates`），
#   这样"本机可以只跑一组"才是一个安全的取舍，而不是让红跨组溜走的那道缝。
#
# 为什么 browser 档跑 windows-latest
# ─────────────────────────────────
# 仓里四台浏览器仪器（smoke / battle-test / np-probe / remote-probe）的默认 Chrome 路径是
#   C:\Program Files\Google\Chrome\Application\chrome.exe
# 而 GitHub 的 windows 镜像**正好在同路径**装了 Chrome ⇒ 与被认证的那台机器同构，不必传参数。
# ⚠️ 但这**不是**它能跑起来的唯一原因：tools/smoke.mjs、np-probe.mjs、remote-probe.mjs 原先各自硬编码
#   `file:///D:/code/Epirus-Web/index.html`，而 runner 的检出路径是 `D:\a\<repo>\<repo>`
#   ⇒ 不改那三处，windows 档照样红。2026-10-01 已改成"从本文件位置现算"（与 battle-test/ui-probe 同款）。
#
# 为什么整轮那一档跑 ubuntu-latest
# ─────────────────────────────────────
# 顺带把"这套工具链不是 Windows 专属"从一句期望变成一条持续被验证的事实。
# 若哪天 ubuntu 档红了而 windows 档绿：那是**发现了真问题**（路径分隔符/行尾/大小写敏感），
# 不要为了让 CI 变绿而把它退回去——请读失败的那条门再决定。
# ⚠️ 反过来说也一样成立：**CI 红了先读那一条门的判词**，别直接重跑；红了五笔才被发现的成本，本文件上面已经写过一次实例。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    # §E355（10-06 用户裁定）：本档改成**整轮的那一遍** —— 一条命令 `gate-all --np --no-browser`，
    # 里面 = np **整轮**（不带 `--group`）+ spec，退出码 0/7 就是这道门的判定（gate-all 自己会印一行总结论）。
    #
    # 【为什么要改成这样】§E335/§E341 之后本机的口径变成"按班次只跑对应模块那一组"（改图/改文档 ⇒ `--group=meta`，9.7 秒）。
    #   代价是**红会跨组潜伏**，而且已经真发生过一次：D225⑩c 从 `c9c382b`（README 排版整理）起就红，
    #   之后五笔提交、约 11 小时没人看见 —— 因为那几遍跑的都是 `--group=meta`，而 D225 在 `train` 组。
    #   ⇒ 本机可以分组跑的前提，是**有一遍不带分组的整轮兜底**。这一档就是那个兜底（每笔 push 与 PR 都跑）。
    #
    # 【为什么带 `--no-browser`】浏览器那三道（smoke / battle / 演化页 map，§E365 起）10-01 起是**观察档**，判据见下面 `browser` 那一节；
    #   把它们放进阻断档 = 用 2/3 概率的红去训练大家忽略红色。gate-all 在摘掉它们时会在总结论里
    #   **点名"本轮缺：smoke battle map ⇒ 不是整轮全绿"**，所以这一档的绿**不等于**"整轮全绿"（那一句仍然只属于本机收工前那遍）。
    #
    # 【历史：为什么这两道曾经是阻断档】原来这里有两个 job（`spec` 与 `np`），各自跑各自的全量；合并只是去重复，
    #   判据一条没松。它们转正时留下的账保留在下面两条，因为那是**runner 能否代表仓库**的依据，不是流水话：
    #
    #   ✅ `spec` 在全新 clone（只有入库文件）上实测通过（2026-10-01，`通过 52 / 52`）。
    #   ✅ `np` 转正依据：runner 上实测绿两遍 **12m00s ‖ 16m46s**（2026-10-01，head 24b9f63 ‖ 5184b2b）。
    #     当初它只是观察档，是因为那 259 道门原先是"**这台机器的属性**"而不是"仓库的属性"：
    #     全新 clone 实测 **250 / 259 exit 1**；9 道门读的是被 gitignore 的本机产物（D137 D139 D141 D150 D155 D161 D163 D176 D200）。
    #     根因**不是**"每道缺一份"，而是这些 bench 吃的是**整个默认包列表**
    #     （tools/probe-kill-reward.mjs:39 / tools/probe-seat-caliber.mjs:27 / tools/np-test.mjs:5438 都写死 3~5 份）。
    #     按谓词量出全部依赖：`grep -ohE docs/artifacts/[A-Za-z0-9._/-]+\.bak -r tools server`
    #     ⇒ 50 个引用 / 45 个未入库 / 43 份盘上还在；45 份已按原路径入库 ⇒ 干净 clone **259 / 259 exit 0**。
    #     ⚠️ 连带后果（今天仍然成立）：干净 clone 会把被跟踪文件的 mtime 刷成"现在" ⇒ 45 份全落进 **D82** 的 24h 时窗 ⇒
    #        最新条目的 `> 产物点名（D82）：` 行必须含全部 45 个名字 —— **入库与记账要一起做**。
    #   ⚠️ 单道秒数不可与串行历史直接比（gate-all 是**并发起跑**）；timeout 60 分钟对 12~17 分钟余量足够。
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # 本机开发用的是 Node v24.20.0；仓里零第三方依赖，只用内置 http/worker_threads/vm。
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 整轮门禁 = np 全量 + spec（条数与末号由工具自己印，本文件不抄）
        run: node tools/gate-all.mjs --np --no-browser

  browser:
    # ⚠️ **10-01 深夜退回观察档**（千问复核发现 · 用户点头）：转阻断之后**非确定性**，不是内容问题。
    #   实测台账（`actions/workflows/gates.yml/runs` + `commits/<sha>/check-runs`，取于 10-01 23:3x）：
    #     8180c71（就是"转阻断"那一笔）browser=**failure** ‖ cffd8a1 success ‖ **1533a54（当前 HEAD，只动文档）failure**
    #     ⇒ 转阻断后 3 次里红 **2** 次；两次失败都只跑 **43 秒**（绿的那两遍是 67 ‖ 70 秒）。
    #   同一台仓库的**本机**连跑 3 遍 smoke/battle 全绿（12.3s ‖ 26~32s，10-01 23:26 实测）⇒ 红的是 runner，不是代码。
    #   ⛔ 只拿到 annotation 一句"Process completed with exit code 1"——job log 要鉴权，复核时取不到 ⇒ **根因未定**。
    #      首要嫌疑：`tools/smoke.mjs` 里那一串**固定 sleep**（导航后 1600ms、点击后 650ms、远程页 2500ms、select 后 500ms）
    #      在慢 1.5~2 倍的 runner 上不够；但这是嫌疑，**没有日志不许当结论**。
    #   ⇒ 为什么必须退回：一个 2/3 概率红的**阻断**档，会把"红"训练成噪音，下次真红没人看 ——
    #     与本仓"永绿假守卫"（D199/D205 那一族）是同一种病的两面。**转正判据：连续 5 次绿**（当前计数从这次重新起算）。
    #   ⚠️ §E355 之后这一档是 **CI 里唯一跑 smoke/battle 的地方**（阻断档 `gates` 用 `--no-browser` 摘掉了它们）
    #     ⇒ 所以"CI 绿了"这句话从此的准确说法是：**np 整轮 + spec 绿，浏览器两档未见红但也未参与判定**。
    #     ⇒ 本机不受影响：`gate-all` 不带 `--no-browser` 时照旧跑四道，收工前那遍才算认证。
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 页面冒烟（CDP 真 Chrome）
        run: node tools/smoke.mjs
      - name: 多人页面对战（CDP 真 Chrome）
        run: node tools/battle-test.mjs
      - name: 冠军演化页页内自检（CDP 真 Chrome · §E365 新增）
        # 为什么放这一档而不是阻断档：它要真 Chrome，而本机认证的 np/spec 那两跑在 ubuntu。
        #   判据 = 页内自检总结论那一行（PASS 条数会变、"0 FAIL"不许变）；shot.mjs 的 exit code 就是这一档的 exit code。
        #   ⚠ 这一档整体仍是 continue-on-error（见上面 10-01 那笔退回记录）⇒ **演化页的红不会阻断提交**，
        #     但它从此会在每次 push 上留一条可见的记录（此前是零记录：CI 与本机关禁都不读 champion-map）。
        run: node champion-map/shot.mjs '--hash=mode=tree&check=1' --dump
