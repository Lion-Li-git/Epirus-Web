name: gates

# 为什么加这个文件
# ────────────────
# 本仓的"当前状态" = np + spec + smoke + battle **四道在同一棵树上全绿**（见 tools/gate-all.mjs 头注）。
# 但在这之前，这四道**只在本机有效**：线上仓库没有任何自动验证，第三方复核要自己开终端跑约 10 分钟，
# 而且每个数字都得自己重算。259 道门是一笔很贵的资产，让它跟着仓库走比跟着某台机器走值钱。
#
# 为什么 browser 档跑 windows-latest
# ─────────────────────────────────
# 仓里四台浏览器仪器（smoke / battle-test / np-probe / remote-probe）的默认 Chrome 路径是
#   C:\Program Files\Google\Chrome\Application\chrome.exe
# 而 GitHub 的 windows 镜像**正好在同路径**装了 Chrome ⇒ 与被认证的那台机器同构，不必传参数。
# ⚠️ 但这**不是**它能跑起来的唯一原因：tools/smoke.mjs、np-probe.mjs、remote-probe.mjs 原先各自硬编码
#   `file:///D:/code/Epirus-Web/index.html`，而 runner 的检出路径是 `D:\a\<repo>\<repo>`
#   ⇒ 不改那三处，windows 档照样红。2026-10-01 已改成"从本文件位置现算"（与 battle-test/ui-probe 同款）。
#
# 为什么 spec / np 档跑 ubuntu-latest
# ─────────────────────────────────────
# 顺带把"这套工具链不是 Windows 专属"从一句期望变成一条持续被验证的事实。
# 若哪天 ubuntu 档红了而 windows 档绿：那是**发现了真问题**（路径分隔符/行尾/大小写敏感），
# 不要为了让 CI 变绿而把它退回去——请读失败的那条门再决定。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  spec:
    # ✅ 直接阻断：本档已在**全新 clone**（只有入库文件）上实测通过（2026-10-01，`spec: 通过 52 / 52`）。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # 本机开发用的是 Node v24.20.0；仓里零第三方依赖，只用内置 http/worker_threads/vm。
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 2 人引擎自测（52 用例 + 500 局 fuzz）
        run: node tools/spec-run.mjs

  np:
    # ✅ 阻断档（2026-10-01 晚转正）。当初为什么只是观察档、以及凭什么转正，都留在这里：
    #
    # 【观察档的理由】np 的 259 道门原先是"**这台机器的属性**"，不是"仓库的属性"：
    #   全新 clone（只有入库文件、没有任何本机 .bak）实测 **250 / 259 exit 1**；9 道门读的是被 gitignore 的本机产物
    #   （D137 D139 D141 D150 D155 D161 D163 D176 D200）。根因**不是**"每道缺一份"，而是这些 bench 吃的是
    #   **整个默认包列表**（tools/probe-kill-reward.mjs:39 / tools/probe-seat-caliber.mjs:27 / tools/np-test.mjs:5438 都写死 3~5 份）。
    #   按谓词量出全部依赖：`grep -ohE docs/artifacts/[A-Za-z0-9._/-]+\.bak -r tools server`
    #   ⇒ 50 个引用 / 45 个未入库 / 43 份盘上还在；45 份已按原路径入库 ⇒ 干净 clone **259 / 259 exit 0**。
    #   ⚠️ 连带后果：干净 clone 会把被跟踪文件的 mtime 刷成"现在" ⇒ 45 份全落进 **D82** 的 24h 时窗 ⇒
    #      最新条目的 `> 产物点名（D82）：` 行必须含全部 45 个名字 —— **入库与记账要一起做**。
    #
    # 【转正依据】runner 上实测绿两遍：**12m00s ‖ 16m46s**（2026-10-01，head 24b9f63 ‖ 5184b2b）。
    #   ⚠️ 单道秒数不可与串行历史直接比（tools/gate-all.mjs 四档并发起跑）；timeout 60 分钟对 12~17 分钟余量足够。
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 多人引擎 + 门禁（条数与末号由工具跑完自己印，不在这里抄）
        run: node tools/np-test.mjs

  browser:
    # ✅ 阻断档（2026-10-01 晚转正）。当初只是观察档，因为 Chrome/CDP 那四台仪器**从没**在 CI 上跑过。
    # 【转正依据】runner 上 `smoke` + `battle` 绿两遍（**67s ‖ 70s**，windows-latest）。
    # 选 windows-latest 的理由：GitHub 的 windows 镜像把 Chrome 装在**与仓库默认路径完全相同**的地方
    #   （C:\Program Files\Google\Chrome\Application\chrome.exe）⇒ 与被认证的那台机器同构，不必传参数。
    #   ⚠️ 但它不是"放哪都能跑"：tools/smoke.mjs / np-probe.mjs / remote-probe.mjs 原先各自硬编码
    #   `file:///D:/code/Epirus-Web/index.html`，而 runner 检出到 `D:/a/<repo>/<repo>` ⇒ v1.5.310 起
    #   已改成"从本文件位置现算"（与 battle-test/ui-probe 同款）。
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 页面冒烟（CDP 真 Chrome）
        run: node tools/smoke.mjs
      - name: 多人页面对战（CDP 真 Chrome）
        run: node tools/battle-test.mjs
