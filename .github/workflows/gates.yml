name: gates

# 为什么加这个文件
# ────────────────
# 本仓的"当前状态" = np + spec + smoke + battle + 演化页页内自检 **五道在同一棵树上全绿**（见 tools/gate-all.mjs 头注；
#   §E365 之前只有四道 —— 第五道是这次补的，因为 champion-map 的自检此前**不在任何门禁的读取面上**）。
# 但在这之前，这几道**只在本机有效**：线上仓库没有任何自动验证，第三方复核要自己开终端跑约 10 分钟，
# 而且每个数字都得自己重算。门禁那几百道（**条数与末号由 `np-test` 跑完自己印，这里不抄** —— 抄过一次"259 道"就漂成了历史数字）
# 是一笔很贵的资产，让它跟着仓库走比跟着某台机器走值钱。
#
# §E355（10-06 用户裁定）：这个 workflow 负责的是**"整轮兜底"那一遍**
# ────────────────────────────────────────────────────────────────────
# 本机口径已经改成"按班次只跑对应模块那一组"（§E335 六组 + §E341 `gate-all --auto` 自己判该跑哪组；
#   改图/改文档 ⇒ `--group=meta` 15 道 ≈ 9.7 秒，而不是每次 10~15 分钟）。
# ⇒ 分组提速的代价是**红会跨组潜伏**，而且真发生过：D225⑩c 从 `c9c382b`（README 排版整理）起一直红，
#   之后五笔提交、约 11 小时没人看见 —— 因为那几遍跑的都是 `--group=meta`，而那道门在 `train` 组里。
# ⇒ 所以本文件现在的职责 = **每笔 push / 每个 PR 跑一遍全部门**（阻断档 `gates`），
#   这样"本机可以只跑一组"才是一个安全的取舍，而不是让红跨组溜走的那道缝。
#
# 2026-10-14（DS）：整轮**摊成 16 份并行**，判定仍然是**一个**
# ─────────────────────────────────────────────────────────
# 背景：用户问"为什么还是所有门禁都堆在整轮门禁里面"。答案有两层，第一层是上面那条 §E355（那是**故意**的兜底），
#   第二层是当时**做不到**拆：`--group=` 那条轴是**累计深度轴**（meta ⊂ ship ⊂ train/ui ⊂ probe ⊂ engine=全部，
#   组与组互相包含）⇒ 摆不出互不相交的并行；而 278 条门当时全住在一个 12339 行的文件里。
# 10-14 拆成 `tools/gates/<部分>.mjs` 16 个文件之后，**"16 个文件"第一次成为一个真正的分区**
#   （互不重叠、并集 = 278 条）⇒ 才有了这个矩阵。判据与实测：
#   · 每个部分**单独跑**都是绿的（16/16）⇒ 没有任何一条门依赖另一个部分的副产物（跨部分副作用 = 0）；
#   · 16 段单跑合计 **943s**，而整轮一次跑是 **975s** ⇒ 差 32s ≈ 16 个进程各 2s 启动，
#     **其余逐秒对上** ⇒ 并集就是那 278 条，不重不漏；
#   · 长尾极不均：`train-runner` 460s + `train-evo` 275s = 总时间的 **78%** ⇒
#     矩阵墙钟 ≈ 最慢那一段（约 8 分钟），而不是 16 段相加。
# ⚠ 覆盖不许靠"人记得"：本文件的 matrix **从 runner 现读**（`--list-parts --json` ⇒ 加第 17 个部分文件时
#   workflow 不用改），并且聚合作业里跑 `tools/gate-parts-check.mjs` 这条**并集守卫**
#   （盘上的部分文件集合 == runner 名单 ‖ Σ条数 == total == 门体里 `^t(` 的行数）。
#   为什么这条必须有：并行的坏法**不是红而是绿** —— 少跑一份照样绿，而"整轮全绿"这句话就被污染了。
#   本仓 10-14 一天之内在同一个形状上栽过两次（拆文件漏了四把按文件名找门体源码的尺、别名迁移漏了几台
#   按名字索引面板的工具），两次都是**静默变瞎**。
#
# 为什么 browser 档跑 windows-latest
# ─────────────────────────────────
# 仓里四台浏览器仪器（smoke / battle-test / np-probe / remote-probe）的默认 Chrome 路径是
#   C:\Program Files\Google\Chrome\Application\chrome.exe
# 而 GitHub 的 windows 镜像**正好在同路径**装了 Chrome ⇒ 与被认证的那台机器同构，不必传参数。
# ⚠️ 但这**不是**它能跑起来的唯一原因：tools/smoke.mjs、np-probe.mjs、remote-probe.mjs 原先各自硬编码
#   `file:///D:/code/Epirus-Web/index.html`，而 runner 的检出路径是 `D:\a\<repo>\<repo>`
#   ⇒ 不改那三处，windows 档照样红。2026-10-01 已改成"从本文件位置现算"（与 battle-test/ui-probe 同款）。
#
# 为什么整轮那一档跑 ubuntu-latest
# ─────────────────────────────────────
# 顺带把"这套工具链不是 Windows 专属"从一句期望变成一条持续被验证的事实。
# 若哪天 ubuntu 档红了而 windows 档绿：那是**发现了真问题**（路径分隔符/行尾/大小写敏感），
# 不要为了让 CI 变绿而把它退回去——请读失败的那条门再决定。
# ⚠️ 反过来说也一样成立：**CI 红了先读那一条门的判词**，别直接重跑；红了五笔才被发现的成本，本文件上面已经写过一次实例。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ── ① plan：部分清单的**单一来源** = tools/np-test.mjs 的 PARTS（不在这里抄一份）──
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      parts: ${{ steps.lp.outputs.parts }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - id: lp
        name: 从 runner 现读部分清单（写死清单迟早在加第 17 个部分时漏掉，而漏掉的表现是"少跑却全绿"）
        run: |
          node tools/np-test.mjs --list-parts --json > /tmp/parts.json
          node -e 'const j=require("/tmp/parts.json");process.stdout.write("parts="+JSON.stringify(j.parts.map(p=>p.part))+"\n")' >> "$GITHUB_OUTPUT"
          node -e 'const j=require("/tmp/parts.json");console.log("部分 " + j.parts.length + " 个 ‖ 条数合计 " + j.total)'

  # ── ② part：一个部分一个作业（矩阵）⇒ 墙钟 ≈ 最慢那一段，且失败能归因到具体部分 ──
  part:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJson(needs.plan.outputs.parts) }}
    name: part ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # `--part=` 与 `--only`/`--group` 同罪：少跑了就是少跑了，np-test 收尾会自己响亮印出
      #   「本部分共 N 条，跑了 M 条 ⇒ 不许当整轮全绿引用」。**整轮全绿这句话只属于聚合作业 ③。**
      - name: np --part=${{ matrix.part }}
        run: node tools/np-test.mjs --part=${{ matrix.part }}

  # ── ③ gates：聚合成**一个**判定（作业名与旧版相同 ⇒ 分支保护/required check 不用改）──
  gates:
    name: gates
    needs: [plan, part]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: 各部分的判定（有红 ⇒ 这一档就红，并点名是哪一段）
        run: |
          echo "part 那一档：${{ needs.part.result }}"
          if [ "${{ needs.part.result }}" != "success" ]; then
            echo "⛔ 有部分红了（或 plan 挂了）⇒ 整轮不成立。去上面 'part <名字>' 那些作业里看是哪一条门，别先重跑。"
            exit 1
          fi
      - name: 并集守卫（全部部分的并集必须 = 整轮；少跑一条就红。条数由脚本现读 ⇒ 这里不写死）
        run: node tools/gate-parts-check.mjs
      - name: spec（2 人引擎 52 用例）
        run: node tools/spec-run.mjs
      # §2026-10-10（Claude 整改建议 §门禁规矩 1）：**门禁只许测行为**的机械检查。
      #   文档明说它「不算门、也不进 np-test」⇒ 所以它是一个独立脚本、一个独立 step：
      #     node tools/gate-sentinel.mjs   报告三类（读 .md ‖ 对源码做正则 ‖ 匹配日志措辞）的**门号清单**。
      #   ⚠️ 现在**只报告不红**（脚本默认 exit 0）：163 条"钉源码行"还没逐条分诊，
      #     此刻让 CI 变红 = 用假红训练大家忽略红色（本仓交过这笔学费）。
      #     分诊完之后把这一行改成 `node tools/gate-sentinel.mjs --strict` 即可开始阻断（一处开关）。
      - name: 门禁哨兵（规矩 1：只许测行为 · 只报告）
        run: node tools/gate-sentinel.mjs

  browser:
    # ⚠️ **10-01 深夜退回观察档**（千问复核发现 · 用户点头）：转阻断之后**非确定性**，不是内容问题。
    #   实测台账（`actions/workflows/gates.yml/runs` + `commits/<sha>/check-runs`，取于 10-01 23:3x）：
    #     8180c71（就是"转阻断"那一笔）browser=**failure** ‖ cffd8a1 success ‖ **1533a54（当前 HEAD，只动文档）failure**
    #     ⇒ 转阻断后 3 次里红 **2** 次；两次失败都只跑 **43 秒**（绿的那两遍是 67 ‖ 70 秒）。
    #   同一台仓库的**本机**连跑 3 遍 smoke/battle 全绿（12.3s ‖ 26~32s，10-01 23:26 实测）⇒ 红的是 runner，不是代码。
    #   ⛔ 只拿到 annotation 一句"Process completed with exit code 1"——job log 要鉴权，复核时取不到 ⇒ **根因未定**。
    #      首要嫌疑：`tools/smoke.mjs` 里那一串**固定 sleep**（导航后 1600ms、点击后 650ms、远程页 2500ms、select 后 500ms）
    #      在慢 1.5~2 倍的 runner 上不够；但这是嫌疑，**没有日志不许当结论**。
    #   ⇒ 为什么必须退回：一个 2/3 概率红的**阻断**档，会把"红"训练成噪音，下次真红没人看 ——
    #     与本仓"永绿假守卫"（D199/D205 那一族）是同一种病的两面。**转正判据：连续 5 次绿**（当前计数从这次重新起算）。
    #   ⚠️ §E355 之后这一档是 **CI 里唯一跑 smoke/battle 的地方**（阻断档 `gates` 用 `--no-browser` 摘掉了它们）
    #     ⇒ 所以"CI 绿了"这句话从此的准确说法是：**np 全部门 + spec 绿，浏览器两档未见红但也未参与判定**。
    #     ⇒ 本机不受影响：`gate-all` 不带 `--no-browser` 时照旧跑四道，收工前那遍才算认证。
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: 页面冒烟（CDP 真 Chrome）
        run: node tools/smoke.mjs
      - name: 多人页面对战（CDP 真 Chrome）
        run: node tools/battle-test.mjs
      - name: 冠军演化页页内自检（CDP 真 Chrome · §E365 新增 · 10-12 补"四个视图各跑一遍 + 读数必须可读"）
        # 为什么放这一档而不是阻断档：它要真 Chrome，而本机认证的 np/spec 那两跑在 ubuntu。
        #   判据 = 页内自检总结论那一行（PASS 条数会变、"0 FAIL"不许变）。
        #   ⚠️ 这一档整体仍是 continue-on-error（见上面 10-01 那笔退回记录）⇒ **演化页的红不会阻断提交**。
        # 🔴 10-12 千问补的两件事（用户裁定"进 CI，先只当观察档"）：
        #   ① **观察档也必须读得出成败**：job 级 `continue-on-error: true` 会让"步骤失败"与"通过"都显示 conclusion=success
        #      ⇒ 我以前在 API 上看到 browser=success 就以为这 86 条过了，那句话其实毫无信息量。
        #      现在把每个视图的 `断言：N PASS ‖ M FAIL` 与退出码写进 job summary（`$GITHUB_STEP_SUMMARY`，API 可取）。
        #   ② **原来只跑 mode=tree 这一个视图**：把同一批自检搬到其余视图上，当场量出两条真红
        #      —— mode=1d 与 mode=3db 的"池层环真画到画布上"都是 差分 0 颗 ⇒ 池档身份在这两个视图里整层不存在。
        #      （先排除了"判据量错画布"：draw1/draw3b 用的就是同一块 cv/g，所以那不是仪器瞎。）已补画，四个视图各 86 PASS / 0 FAIL。
        shell: bash
        run: |
          # ⚠ 这个 shell 是 `bash -e -o pipefail`：循环里任何一条命令非零（或 `grep` 没命中 + pipefail）
          #   都会**当场中止**，于是下面那句 `cat /tmp/shot-all.log` 永远轮不到 ⇒ **红得看不见原因**。
          #   10-12 实测：run #153 第 6 步 4 秒红，日志里连一行"视图 mode=… ‖ … ‖ exit=" 都没有，
          #   而 /tmp/shot-*.log 是 runner 上的临时文件，事后取不到 ⇒ 这一步当时是"黑箱红"。
          #   口径改成：**允许中间失败**、收集完四个视图再统一 exit；失败时把该视图日志的尾部也写进汇总
          #   （与这段注释上面那两条同一条纪律：观察档也必须读得出成败）。
          set +e
          fail=0
          : > /tmp/shot-all.log
          for m in tree 1d 3db map; do
            node champion-map/shot.mjs "--hash=mode=$m&check=1" --dump > "/tmp/shot-$m.log" 2>&1
            st=$?
            line=$(grep -E '^断言：' "/tmp/shot-$m.log" | tail -1)
            [ -n "$line" ] || line='（没抓到"断言："那一行 ⇒ 这一步本身没跑成，别当全绿）'
            echo "视图 mode=$m ‖ ${line} ‖ exit=${st}" >> /tmp/shot-all.log
            if [ "$st" -ne 0 ]; then fail=1
              echo "--- mode=$m 日志尾 25 行（失败原因在这里） ---" >> /tmp/shot-all.log
              tail -25 "/tmp/shot-$m.log" >> /tmp/shot-all.log
            fi
          done
          { echo "## 谱系图页内自检（观察档 · 不阻断）"; echo; echo '```'; cat /tmp/shot-all.log; echo '```';
            echo; echo "退出码口径：0=全过 ‖ 1=有 FAIL ‖ 2=浏览器没跑出结果或一条断言都没跑（宁可红也不许假绿）。"; } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/shot-all.log
          exit $fail
